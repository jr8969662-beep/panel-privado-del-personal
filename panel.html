<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Comisaría - Panel del personal</title>
<style>
  :root{
    --azul-fondo:#0a1e3d;
    --azul-oscuro:#0d2a4d;
    --azul:#1a3a6b;
    --azul-claro:#2c5aa0;
    --dorado:#c9a961;
    --dorado-claro:#e6c988;
    --dorado-brilloso:#f0d78c;
    --verde:#15803d;
    --rojo:#b91c1c;
    --amarillo:#ca8a04;
    --sombra-suave:0 2px 8px rgba(13,42,77,0.08);
    --sombra-media:0 4px 16px rgba(13,42,77,0.12);
    --sombra-fuerte:0 8px 32px rgba(13,42,77,0.16);
  }
  *{box-sizing:border-box;}
  html{background:var(--azul-fondo); min-height:100%;}
  body{
    font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    background:var(--azul-fondo);
    margin:0;
    color:#fff;
    position:relative;
    overflow-x:hidden;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  body::before{
    content:'';
    position:fixed;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:100vmin;
    height:100vmin;
    background-image:url('logo-policia.png.jpeg');
    background-size:contain;
    background-repeat:no-repeat;
    background-position:center;
    opacity:0.25;
    pointer-events:none;
    z-index:0;
  }
  body > *{position:relative; z-index:1;}

  header{
    background:linear-gradient(135deg, var(--azul-oscuro) 0%, var(--azul) 100%);
    color:#fff;
    padding:20px 24px;
    position:relative;
    overflow:hidden;
    border-bottom:3px solid var(--dorado);
    box-shadow:var(--sombra-media);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
  }
  header::after{
    content:'';
    position:absolute;
    top:-50%; right:-10%;
    width:400px; height:400px;
    background:radial-gradient(circle, rgba(201,169,97,0.15) 0%, transparent 70%);
    border-radius:50%;
    pointer-events:none;
  }
  header .header-info{
    display:flex;
    align-items:center;
    gap:14px;
    position:relative;
    z-index:2;
  }
  header .header-logo{
    width:52px;
    height:52px;
    background-image:url('logo-policia.png.jpeg');
    background-size:contain;
    background-repeat:no-repeat;
    background-position:center;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,0.3));
    flex-shrink:0;
  }
  header .header-texto h1{
    margin:0;
    font-size:1.05rem;
    font-weight:700;
    color:#fff;
    text-shadow:0 2px 4px rgba(0,0,0,0.2);
  }
  header .header-texto p{
    margin:2px 0 0;
    font-size:0.75rem;
    color:var(--dorado-claro);
    font-weight:500;
    letter-spacing:0.02em;
  }
  #btn-salir{
    background:rgba(255,255,255,0.15);
    color:#fff;
    border:1px solid rgba(255,255,255,0.35);
    padding:8px 16px;
    border-radius:6px;
    cursor:pointer;
    font-size:0.85rem;
    font-weight:600;
    transition:all 0.2s;
    position:relative;
    z-index:2;
  }
  #btn-salir:hover{
    background:rgba(255,255,255,0.25);
    border-color:var(--dorado);
  }

  main{
    max-width:1000px;
    margin:24px auto;
    padding:0 16px 32px;
    width:100%;
    flex:1;
  }

  /* Login */
  #vista-login{
    max-width:360px;
    margin:60px auto 0;
    background:rgba(255,255,255,0.95);
    backdrop-filter:blur(10px);
    border:1px solid rgba(201,169,97,0.4);
    border-top:3px solid var(--dorado);
    border-radius:12px;
    padding:30px 26px;
    box-shadow:var(--sombra-fuerte);
    text-align:center;
  }
  #vista-login .login-logo{
    width:80px; height:80px;
    margin:0 auto 16px;
    background-image:url('logo-policia.png.jpeg');
    background-size:contain;
    background-repeat:no-repeat;
    background-position:center;
  }
  #vista-login h2{
    margin:0 0 6px;
    font-size:1.15rem;
    color:var(--azul-oscuro);
    font-weight:700;
  }
  #vista-login .login-sub{
    margin:0 0 20px;
    font-size:0.82rem;
    color:#6b7280;
  }
  #vista-login label{
    display:block;
    font-size:0.85rem;
    font-weight:600;
    margin:14px 0 6px;
    text-align:left;
    color:#1f2937;
  }
  #vista-login input{
    width:100%;
    padding:10px 12px;
    border:1px solid #d7dde5;
    border-radius:6px;
    font-size:0.9rem;
    font-family:inherit;
    transition:border-color 0.2s;
    background:#fff;
    color:#1f2937;
  }
  #vista-login input:focus{
    outline:none;
    border-color:var(--azul-claro);
    box-shadow:0 0 0 3px rgba(44,90,160,0.1);
  }
  #vista-login button{
    margin-top:20px;
    width:100%;
    padding:11px;
    background:linear-gradient(135deg, var(--azul) 0%, var(--azul-claro) 100%);
    color:#fff;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:0.9rem;
    font-weight:600;
    transition:all 0.2s;
  }
  #vista-login button:hover{
    transform:translateY(-1px);
    box-shadow:var(--sombra-media);
  }
  #error-login{
    color:#b91c1c;
    font-size:0.82rem;
    margin-top:12px;
    display:none;
    background:#fee2e2;
    padding:8px 12px;
    border-radius:6px;
  }

  /* Panel */
  #vista-panel{display:none;}

  /* Tarjetas de resumen */
  .resumen{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
    gap:14px;
    margin-bottom:20px;
  }
  .tarjeta-resumen{
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:10px;
    padding:18px 20px;
    box-shadow:var(--sombra-suave);
    display:flex;
    align-items:center;
    gap:14px;
    transition:transform 0.2s, box-shadow 0.2s, background 0.2s;
  }
  .tarjeta-resumen:hover{
    transform:translateY(-2px);
    box-shadow:var(--sombra-media);
    background:rgba(255,255,255,0.18);
  }
  .tarjeta-resumen .icono{
    width:46px; height:46px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.4rem;
    flex-shrink:0;
    background:rgba(255,255,255,0.15);
  }
  .tarjeta-resumen .info{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .tarjeta-resumen .numero{
    font-size:1.6rem;
    font-weight:700;
    color:#fff;
    line-height:1;
    text-shadow:0 2px 4px rgba(0,0,0,0.3);
  }
  .tarjeta-resumen .label{
    font-size:0.75rem;
    color:var(--dorado-claro);
    text-transform:uppercase;
    letter-spacing:0.05em;
    font-weight:600;
  }

  /* Filtros */
  .filtros{
    display:flex;
    gap:10px;
    margin-bottom:16px;
    flex-wrap:wrap;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(8px);
    padding:14px;
    border-radius:10px;
    box-shadow:var(--sombra-suave);
    border:1px solid rgba(255,255,255,0.15);
  }
  .filtros input,
  .filtros select{
    padding:9px 12px;
    border:1px solid rgba(255,255,255,0.2);
    border-radius:6px;
    font-size:0.85rem;
    font-family:inherit;
    background:rgba(0,0,0,0.2);
    color:#fff;
    transition:border-color 0.2s;
  }
  .filtros input::placeholder{color:rgba(255,255,255,0.6);}
  .filtros input:focus,
  .filtros select:focus{
    outline:none;
    border-color:var(--dorado);
    box-shadow:0 0 0 3px rgba(201,169,97,0.2);
  }
  .filtros select option{
    background:var(--azul-oscuro);
    color:#fff;
  }
  #filtro-busqueda{
    flex:1;
    min-width:200px;
  }
  .btn-filtro{
    padding:9px 16px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:0.85rem;
    font-weight:600;
    transition:all 0.2s;
  }
  #btn-actualizar{
    background:var(--azul);
    color:#fff;
    border:1px solid rgba(255,255,255,0.2);
  }
  #btn-actualizar:hover{
    background:var(--azul-claro);
  }
  #btn-exportar{
    background:var(--dorado);
    color:var(--azul-oscuro);
  }
  #btn-exportar:hover{
    background:var(--dorado-claro);
  }

  /* Tabla TRANSPARENTE */
  .tabla-wrapper{
    background:transparent;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.2);
    overflow:hidden;
    backdrop-filter:blur(2px);
  }
  table{
    width:100%;
    border-collapse:collapse;
  }
  th, td{
    padding:12px 14px;
    text-align:left;
    font-size:0.85rem;
    border-bottom:1px solid rgba(255,255,255,0.12);
    color:#fff;
  }
  th{
    background:rgba(201,169,97,0.15);
    color:var(--dorado-claro);
    font-weight:700;
    font-size:0.78rem;
    text-transform:uppercase;
    letter-spacing:0.03em;
    border-bottom:2px solid rgba(201,169,97,0.4);
  }
  tr.fila-solicitud{cursor:pointer; transition:background 0.15s; color:#fff;}
  tr.fila-solicitud:hover{background:rgba(255,255,255,0.1);}
  tr.fila-solicitud:last-child td{border-bottom:none;}
  tr.fila-solicitud td{color:#e0e7f1;}

  .etiqueta{
    padding:4px 10px;
    border-radius:12px;
    font-size:0.72rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.03em;
    display:inline-block;
  }
  .etiqueta.pendiente{background:rgba(202,138,4,0.3); color:#fcd34d; border:1px solid rgba(252,211,77,0.5);}
  .etiqueta.procesado{background:rgba(21,128,61,0.3); color:#86efac; border:1px solid rgba(134,239,172,0.5);}
  .etiqueta.denegado{background:rgba(185,28,28,0.3); color:#fca5a5; border:1px solid rgba(252,165,165,0.5);}

  /* Detalle TRANSPARENTE */
  #detalle{
    display:none;
    background:rgba(13,42,77,0.6);
    backdrop-filter:blur(8px);
    border:1px solid rgba(201,169,97,0.4);
    border-top:3px solid var(--dorado);
    border-radius:10px;
    padding:26px;
    margin-top:20px;
    box-shadow:var(--sombra-media);
  }
  #detalle h3{
    margin:0 0 4px;
    color:var(--dorado-claro);
    font-size:1.1rem;
  }
  #detalle .detalle-fecha{
    font-size:0.8rem;
    color:rgba(255,255,255,0.7);
    margin-bottom:16px;
    padding-bottom:16px;
    border-bottom:1px solid rgba(255,255,255,0.2);
  }
  #detalle dl{
    margin:0;
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
    gap:12px 20px;
  }
  #detalle dt{
    font-size:0.72rem;
    color:var(--dorado-claro);
    text-transform:uppercase;
    letter-spacing:0.03em;
    font-weight:600;
    margin-top:0;
  }
  #detalle dd{
    margin:2px 0 8px;
    font-size:0.9rem;
    color:#fff;
  }
  #detalle dd img{
    max-width:100%;
    max-height:280px;
    border:1px solid rgba(255,255,255,0.3);
    border-radius:8px;
    margin-top:4px;
    display:block;
    cursor:pointer;
    transition:transform 0.2s;
  }
  #detalle dd img:hover{
    transform:scale(1.02);
    box-shadow:var(--sombra-media);
  }

  #detalle .btns{
    margin-top:24px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    padding-top:18px;
    border-top:1px solid rgba(255,255,255,0.2);
  }
  #detalle button{
    padding:10px 18px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:0.85rem;
    font-weight:600;
    transition:all 0.2s;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  #btn-validar{background:#15803d; color:#fff;}
  #btn-validar:hover{background:#166534;}
  #btn-denegar{background:#b91c1c; color:#fff;}
  #btn-denegar:hover{background:#991b1b;}
  #btn-pendiente{background:#ca8a04; color:#fff;}
  #btn-pendiente:hover{background:#a16207;}
  #btn-imprimir{background:var(--azul); color:#fff; border:1px solid rgba(255,255,255,0.2);}
  #btn-imprimir:hover{background:var(--azul-claro);}
  #btn-cerrar-detalle{background:rgba(255,255,255,0.15); color:#fff; border:1px solid rgba(255,255,255,0.2);}
  #btn-cerrar-detalle:hover{background:rgba(255,255,255,0.25);}

  .vacio{
    padding:40px 20px;
    text-align:center;
    color:rgba(255,255,255,0.7);
    font-size:0.9rem;
  }
  .vacio .vacio-icono{
    font-size:3rem;
    margin-bottom:12px;
    opacity:0.5;
  }

  /* Modal para ver foto grande */
  #modal-foto{
    display:none;
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.95);
    z-index:9999;
    padding:20px;
    align-items:center;
    justify-content:center;
  }
  #modal-foto.activo{display:flex;}
  #modal-foto img{
    max-width:100%;
    max-height:100%;
    border-radius:8px;
  }
  #modal-foto .cerrar-modal{
    position:absolute;
    top:20px; right:20px;
    background:rgba(255,255,255,0.9);
    color:#000;
    border:none;
    width:44px; height:44px;
    border-radius:50%;
    cursor:pointer;
    font-size:1.4rem;
    font-weight:700;
  }

  @media (max-width: 600px){
    header{padding:14px 16px;}
    header .header-logo{width:42px; height:42px;}
    header .header-texto h1{font-size:0.92rem;}
    header .header-texto p{font-size:0.68rem;}
    main{margin:16px auto; padding:0 10px 20px;}
    .tarjeta-resumen{padding:14px 16px;}
    .tarjeta-resumen .numero{font-size:1.3rem;}
    .filtros{padding:10px;}
    th, td{padding:10px 8px; font-size:0.78rem;}
    th:nth-child(1), td:nth-child(1){display:none;}
    #detalle{padding:18px;}
    #detalle .btns{flex-direction:column;}
    #detalle button{width:100%; justify-content:center;}
  }
</style>
</head>
<body>

<header>
  <div class="header-info">
    <div class="header-logo"></div>
    <div class="header-texto">
      <h1>Panel del personal</h1>
      <p>Policía de Salta · DMI (JP)</p>
    </div>
  </div>
  <button id="btn-salir">Salir</button>
</header>

<main>

  <!-- LOGIN -->
  <div id="vista-login">
    <div class="login-logo"></div>
    <h2>Ingreso del personal</h2>
    <p class="login-sub">Acceso restringido · Policía de Salta</p>
    <label>Usuario (email)</label>
    <input type="email" id="login-email" autocomplete="username" placeholder="tu@email.com">
    <label>Contraseña</label>
    <input type="password" id="login-pass" autocomplete="current-password" placeholder="••••••••">
    <button id="btn-entrar">Ingresar</button>
    <p id="error-login"></p>
  </div>

  <!-- PANEL -->
  <div id="vista-panel">

    <div class="resumen">
      <div class="tarjeta-resumen pendiente">
        <div class="icono">🟡</div>
        <div class="info">
          <span class="numero" id="count-pendientes">0</span>
          <span class="label">Pendientes</span>
        </div>
      </div>
      <div class="tarjeta-resumen procesado">
        <div class="icono">🟢</div>
        <div class="info">
          <span class="numero" id="count-procesados">0</span>
          <span class="label">Procesados</span>
        </div>
      </div>
      <div class="tarjeta-resumen denegado">
        <div class="icono">🔴</div>
        <div class="info">
          <span class="numero" id="count-denegados">0</span>
          <span class="label">Denegados</span>
        </div>
      </div>
    </div>

    <div class="filtros">
      <input type="text" id="filtro-busqueda" placeholder="🔍 Buscar por DNI o nombre...">
      <select id="filtro-estado">
        <option value="">Todos los estados</option>
        <option value="pendiente">Pendientes</option>
        <option value="procesado">Procesados</option>
        <option value="denegado">Denegados</option>
      </select>
      <select id="filtro-comisaria">
        <option value="">Todas las comisarías</option>
      </select>
      <select id="filtro-tramite">
        <option value="">Todos los trámites</option>
        <option value="residencia">Residencia</option>
        <option value="convivencia">Convivencia</option>
        <option value="carencia">Carencia de recursos</option>
      </select>
      <button id="btn-actualizar" class="btn-filtro" type="button">🔄 Actualizar</button>
      <button id="btn-exportar" class="btn-filtro" type="button">📥 Exportar</button>
    </div>

    <div class="tabla-wrapper">
      <table>
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Trámite</th>
            <th>Solicitante</th>
            <th>Comisaría</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody id="tabla-solicitudes"></tbody>
      </table>
      <p class="vacio" id="mensaje-vacio" style="display:none;">
        <span class="vacio-icono">📭</span><br>
        No hay solicitudes con estos filtros.
      </p>
    </div>

    <div id="detalle">
      <h3 id="detalle-titulo"></h3>
      <p class="detalle-fecha" id="detalle-fecha"></p>
      <dl id="detalle-contenido"></dl>
      <div class="btns">
        <button id="btn-validar">✓ Validar</button>
        <button id="btn-denegar">✕ Denegar</button>
        <button id="btn-pendiente">⏱ Marcar pendiente</button>
        <button id="btn-imprimir">🖨 Imprimir</button>
        <button id="btn-cerrar-detalle">Cerrar</button>
      </div>
    </div>
  </div>

</main>

<!-- Modal para ver foto en grande -->
<div id="modal-foto">
  <button class="cerrar-modal" id="cerrar-modal">✕</button>
  <img id="foto-grande" alt="Foto ampliada">
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="comisarias-config.js"></script>
<script>
const vistaLogin = document.getElementById('vista-login');
const vistaPanel = document.getElementById('vista-panel');
const btnSalir = document.getElementById('btn-salir');
const errorLogin = document.getElementById('error-login');

document.getElementById('btn-entrar').addEventListener('click', async () => {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  errorLogin.style.display = 'none';

  if (!email || !pass) {
    errorLogin.textContent = 'Completá usuario y contraseña.';
    errorLogin.style.display = 'block';
    return;
  }

  const { error } = await supabaseClient.auth.signInWithPassword({ email, password: pass });
  if (error) {
    errorLogin.textContent = 'Usuario o contraseña incorrectos.';
    errorLogin.style.display = 'block';
  }
});

document.getElementById('login-pass').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') document.getElementById('btn-entrar').click();
});

btnSalir.addEventListener('click', () => supabaseClient.auth.signOut());

function mostrarSesion(sesionActiva) {
  if (sesionActiva) {
    vistaLogin.style.display = 'none';
    vistaPanel.style.display = 'block';
    btnSalir.style.display = 'inline-block';
    cargarSolicitudes();
  } else {
    vistaLogin.style.display = 'block';
    vistaPanel.style.display = 'none';
    btnSalir.style.display = 'none';
  }
}

supabaseClient.auth.getSession().then(({ data: { session } }) => mostrarSesion(!!session));
supabaseClient.auth.onAuthStateChange((_event, session) => mostrarSesion(!!session));

const filtroComisaria = document.getElementById('filtro-comisaria');
DEPENDENCIAS_POLICIALES.forEach(dep => {
  const opt = document.createElement('option');
  opt.value = dep.nombre;
  opt.textContent = dep.nombre;
  filtroComisaria.appendChild(opt);
});

const etiquetasDetalle = {
  nombre: 'Nombre completo', dni: 'DNI', fechaNacimiento: 'Fecha de nacimiento',
  domicilio: 'Domicilio', localidad: 'Localidad', tiempoResidencia: 'Tiempo de residencia',
  motivo: 'Motivo del trámite', nombreSolicitante: 'Nombre del solicitante',
  dniSolicitante: 'DNI del solicitante', nombreConviviente: 'Nombre del conviviente',
  dniConviviente: 'DNI del conviviente', domicilioComun: 'Domicilio en común',
  tiempoConvivencia: 'Tiempo de convivencia', estadoCivil: 'Estado civil',
  situacionLaboral: 'Situación laboral', personasACargo: 'Personas a cargo',
  testigo1Nombre: 'Nombre del testigo 1', testigo1Dni: 'DNI del testigo 1',
  testigo2Nombre: 'Nombre del testigo 2', testigo2Dni: 'DNI del testigo 2',
  foto_solicitante: 'Foto del DNI - Solicitante',
  foto_testigo1: 'Foto del DNI - Testigo 1',
  foto_testigo2: 'Foto del DNI - Testigo 2',
};

let solicitudesCache = [];

async function cargarSolicitudes() {
  const { data, error } = await supabaseClient
    .from('solicitudes')
    .select('*')
    .order('created_at', { ascending: false });
  if (error) { console.error(error); return; }
  solicitudesCache = data || [];
  actualizarContadores();
  renderTabla();
}

function actualizarContadores() {
  const pendientes = solicitudesCache.filter(s => s.estado === 'pendiente').length;
  const procesados = solicitudesCache.filter(s => s.estado === 'procesado').length;
  const denegados = solicitudesCache.filter(s => s.estado === 'denegado').length;
  document.getElementById('count-pendientes').textContent = pendientes;
  document.getElementById('count-procesados').textContent = procesados;
  document.getElementById('count-denegados').textContent = denegados;
}

document.getElementById('btn-actualizar').addEventListener('click', cargarSolicitudes);

supabaseClient
  .channel('solicitudes-cambios')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'solicitudes' }, cargarSolicitudes)
  .subscribe();

function normalizarTexto(t) {
  return String(t || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .trim();
}

function obtenerDniSolicitud(s) {
  const d = s.datos || {};
  return d.dni || d.dniSolicitante || d.testigo1Dni || '';
}

function obtenerNombreSolicitud(s) {
  const d = s.datos || {};
  return d.nombre || d.nombreSolicitante || d.nombreConviviente || '';
}

function renderTabla() {
  const estado = document.getElementById('filtro-estado').value;
  const comisaria = document.getElementById('filtro-comisaria').value;
  const tramite = document.getElementById('filtro-tramite').value;
  const busqueda = normalizarTexto(document.getElementById('filtro-busqueda').value);

  const filtradas = solicitudesCache.filter(s => {
    if (estado && s.estado !== estado) return false;
    if (comisaria && s.comisaria_asignada !== comisaria) return false;
    if (tramite && s.tramite !== tramite) return false;
    if (busqueda) {
      const nombre = normalizarTexto(obtenerNombreSolicitud(s));
      const dni = normalizarTexto(obtenerDniSolicitud(s));
      if (!nombre.includes(busqueda) && !dni.includes(busqueda)) return false;
    }
    return true;
  });

  const tbody = document.getElementById('tabla-solicitudes');
  tbody.innerHTML = '';
  document.getElementById('mensaje-vacio').style.display = filtradas.length ? 'none' : 'block';

  filtradas.forEach(s => {
    const tr = document.createElement('tr');
    tr.className = 'fila-solicitud';
    const fecha = s.created_at ? new Date(s.created_at).toLocaleString('es-AR') : '-';
    const nombreSolicitante = obtenerNombreSolicitud(s) || '-';
    const estadoTexto = s.estado === 'procesado' ? 'Procesado' :
                        s.estado === 'denegado' ? 'Denegado' : 'Pendiente';
    tr.innerHTML = `
      <td>${fecha}</td>
      <td>${s.tramite_titulo || s.tramite || '-'}</td>
      <td>${nombreSolicitante}</td>
      <td>${s.comisaria_asignada || '-'}</td>
      <td><span class="etiqueta ${s.estado}">${estadoTexto}</span></td>
    `;
    tr.addEventListener('click', () => mostrarDetalle(s));
    tbody.appendChild(tr);
  });
}

document.getElementById('filtro-estado').addEventListener('change', renderTabla);
filtroComisaria.addEventListener('change', renderTabla);
document.getElementById('filtro-tramite').addEventListener('change', renderTabla);
document.getElementById('filtro-busqueda').addEventListener('input', renderTabla);

let solicitudAbierta = null;

function mostrarDetalle(s) {
  solicitudAbierta = s;
  document.getElementById('detalle-titulo').textContent = s.tramite_titulo || s.tramite;
  const fecha = s.created_at ? new Date(s.created_at).toLocaleString('es-AR') : '-';
  document.getElementById('detalle-fecha').textContent = 'Solicitud recibida el ' + fecha;

  const cont = document.getElementById('detalle-contenido');
  cont.innerHTML = '';

  const dt0 = document.createElement('dt');
  dt0.textContent = 'Comisaría asignada';
  const dd0 = document.createElement('dd');
  dd0.textContent = s.comisaria_asignada || '-';
  cont.appendChild(dt0);
  cont.appendChild(dd0);

  const dtE = document.createElement('dt');
  dtE.textContent = 'Estado actual';
  const ddE = document.createElement('dd');
  const estadoTexto = s.estado === 'procesado' ? 'Procesado' :
                      s.estado === 'denegado' ? 'Denegado' : 'Pendiente';
  ddE.innerHTML = `<span class="etiqueta ${s.estado}">${estadoTexto}</span>`;
  cont.appendChild(dtE);
  cont.appendChild(ddE);

  Object.entries(s.datos || {}).forEach(([campo, valor]) => {
    if (!valor) return;
    const dt = document.createElement('dt');
    dt.textContent = etiquetasDetalle[campo] || campo;
    const dd = document.createElement('dd');
    if (campo.startsWith('foto_')) {
      const img = document.createElement('img');
      img.src = valor;
      img.alt = etiquetasDetalle[campo] || campo;
      img.addEventListener('click', () => abrirFotoGrande(valor));
      dd.appendChild(img);
    } else {
      dd.textContent = valor;
    }
    cont.appendChild(dt);
    cont.appendChild(dd);
  });

  document.getElementById('detalle').style.display = 'block';
  document.getElementById('detalle').scrollIntoView({ behavior: 'smooth' });
}

document.getElementById('btn-cerrar-detalle').addEventListener('click', () => {
  document.getElementById('detalle').style.display = 'none';
});

async function cambiarEstado(nuevoEstado) {
  if (!solicitudAbierta) return;

  if (nuevoEstado === 'denegado') {
    const motivo = prompt('Motivo de la denegación (opcional):');
    if (motivo === null) return;
  }

  const { error } = await supabaseClient
    .from('solicitudes')
    .update({ estado: nuevoEstado })
    .eq('id', solicitudAbierta.id);

  if (error) {
    console.error(error);
    alert('No se pudo actualizar. Revisá tu conexión.');
    return;
  }

  document.getElementById('detalle').style.display = 'none';
  await cargarSolicitudes();
}

document.getElementById('btn-validar').addEventListener('click', () => cambiarEstado('procesado'));
document.getElementById('btn-denegar').addEventListener('click', () => cambiarEstado('denegado'));
document.getElementById('btn-pendiente').addEventListener('click', () => cambiarEstado('pendiente'));

document.getElementById('btn-imprimir').addEventListener('click', () => {
  if (!solicitudAbierta) return;
  const s = solicitudAbierta;
  const ventana = window.open('', '_blank');
  const titulo = s.tramite_titulo || s.tramite;
  const fecha = s.created_at ? new Date(s.created_at).toLocaleString('es-AR') : '-';

  let html = `
    <!DOCTYPE html>
    <html><head>
    <meta charset="UTF-8">
    <title>${titulo}</title>
    <style>
      body{font-family:Arial,sans-serif; padding:30px; max-width:800px; margin:0 auto; color:#1f2937;}
      h1{text-align:center; color:#0d2a4d; font-size:1.3rem; margin-bottom:4px; border-bottom:2px solid #c9a961; padding-bottom:12px;}
      .subt{text-align:center; color:#6b7280; font-size:0.85rem; margin-bottom:24px;}
      dl{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
      dt{font-size:0.72rem; color:#6b7280; text-transform:uppercase; letter-spacing:0.03em; font-weight:600;}
      dd{margin:2px 0 0; font-size:0.9rem;}
      dd img{max-width:280px; border:1px solid #ddd; border-radius:6px; margin-top:6px;}
      .firma{margin-top:60px; display:flex; justify-content:space-between;}
      .firma div{border-top:1px solid #333; padding-top:6px; width:40%; text-align:center; font-size:0.8rem;}
      @media print{body{padding:10px;}}
    </style>
    </head><body>
    <h1>${titulo}</h1>
    <p class="subt">Policía de Salta · Dirección de Modernización e Innovación Tecnológica (JP)</p>
    <p class="subt">Solicitud recibida el ${fecha}</p>
    <dl>
      <div><dt>Comisaría asignada</dt><dd>${s.comisaria_asignada || '-'}</dd></div>
      <div><dt>Estado</dt><dd>${s.estado || 'pendiente'}</dd></div>
  `;

  Object.entries(s.datos || {}).forEach(([campo, valor]) => {
    if (!valor) return;
    const label = etiquetasDetalle[campo] || campo;
    if (campo.startsWith('foto_')) {
      html += `<div style="grid-column:1/-1;"><dt>${label}</dt><dd><img src="${valor}"></dd></div>`;
    } else {
      html += `<div><dt>${label}</dt><dd>${valor}</dd></div>`;
    }
  });

  html += `
    </dl>
    <div class="firma">
      <div>Firma del solicitante</div>
      <div>Firma y sello - Autoridad policial</div>
    </div>
    </body></html>
  `;

  ventana.document.write(html);
  ventana.document.close();
  setTimeout(() => ventana.print(), 500);
});

document.getElementById('btn-exportar').addEventListener('click', () => {
  const estado = document.getElementById('filtro-estado').value;
  const comisaria = document.getElementById('filtro-comisaria').value;
  const tramite = document.getElementById('filtro-tramite').value;
  const busqueda = normalizarTexto(document.getElementById('filtro-busqueda').value);

  const filtradas = solicitudesCache.filter(s => {
    if (estado && s.estado !== estado) return false;
    if (comisaria && s.comisaria_asignada !== comisaria) return false;
    if (tramite && s.tramite !== tramite) return false;
    if (busqueda) {
      const nombre = normalizarTexto(obtenerNombreSolicitud(s));
      const dni = normalizarTexto(obtenerDniSolicitud(s));
      if (!nombre.includes(busqueda) && !dni.includes(busqueda)) return false;
    }
    return true;
  });

  if (!filtradas.length) {
    alert('No hay solicitudes para exportar con los filtros actuales.');
    return;
  }

  const filas = [['Fecha', 'Trámite', 'Solicitante', 'DNI', 'Comisaría', 'Estado']];
  filtradas.forEach(s => {
    filas.push([
      s.created_at ? new Date(s.created_at).toLocaleString('es-AR') : '-',
      s.tramite_titulo || s.tramite || '-',
      obtenerNombreSolicitud(s) || '-',
      obtenerDniSolicitud(s) || '-',
      s.comisaria_asignada || '-',
      s.estado || 'pendiente'
    ]);
  });

  const csv = filas.map(fila =>
    fila.map(celda => `"${String(celda).replace(/"/g, '""')}"`).join(',')
  ).join('\n');

  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `solicitudes_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
});

function abrirFotoGrande(src) {
  document.getElementById('foto-grande').src = src;
  document.getElementById('modal-foto').classList.add('activo');
}

document.getElementById('cerrar-modal').addEventListener('click', () => {
  document.getElementById('modal-foto').classList.remove('activo');
});

document.getElementById('modal-foto').addEventListener('click', (e) => {
  if (e.target.id === 'modal-foto') {
    document.getElementById('modal-foto').classList.remove('activo');
  }
});
</script>

</body>
</html>

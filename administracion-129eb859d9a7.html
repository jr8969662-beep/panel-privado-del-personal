<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Administración · Mi Comisaría</title>
<style>
  :root{--azul-fondo:#0a1e3d;--azul-oscuro:#0d2a4d;--azul:#1a3a6b;--azul-claro:#2c5aa0;
    --dorado:#c9a961;--dorado-claro:#e6c988;--dorado-brilloso:#f0d78c;--ok:#15803d;--mal:#b91c1c;--aviso:#ca8a04;}
  *{box-sizing:border-box}
  html{background:var(--azul-fondo);min-height:100%}
  body{margin:0;font-family:'Segoe UI',-apple-system,Arial,sans-serif;background:var(--azul-fondo);color:#fff;position:relative;min-height:100vh}
  body::before{content:'';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:100vmin;height:100vmin;
    background-image:url('logo-policia.png.jpeg');background-size:contain;background-repeat:no-repeat;background-position:center;
    opacity:.45;pointer-events:none;z-index:0}
  body>*{position:relative;z-index:1}
  header{background:linear-gradient(135deg,var(--azul-oscuro),var(--azul));padding:12px 22px;display:flex;align-items:center;
    justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--dorado);box-shadow:0 4px 16px rgba(0,0,0,.3)}
  header h1{font-size:1.1rem;margin:0;color:var(--dorado-brilloso);display:flex;align-items:center;gap:12px}
  header h1::before{content:'';width:42px;height:42px;background:url('logo-policia.png.jpeg') center/contain no-repeat;filter:drop-shadow(0 2px 10px rgba(201,169,97,.5))}
  header h1 small{display:block;font-size:.72rem;font-weight:400;color:var(--dorado-claro)}
  .quien{font-size:.85rem;color:var(--dorado-claro);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  #app{display:flex;min-height:calc(100vh - 70px)}
  #menu{width:215px;flex-shrink:0;background:rgba(10,30,61,.94);border-right:1px solid rgba(201,169,97,.25);padding:10px 0}
  #menu button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:#b8c7e0;padding:12px 18px;cursor:pointer;font-size:.93rem;text-align:left;border-left:4px solid transparent}
  #menu button:hover{background:rgba(255,255,255,.06);color:#fff}
  #menu button.on{color:var(--dorado-brilloso);background:rgba(201,169,97,.12);border-left-color:var(--dorado)}
  #menu .n{margin-left:auto;background:var(--mal);color:#fff;border-radius:10px;padding:1px 8px;font-size:.72rem}
  main{flex:1;padding:20px;min-width:0;max-width:1400px}
  h2.titulo{margin:0 0 4px;color:var(--dorado-brilloso);font-size:1.3rem}
  p.sub{margin:0 0 16px;color:rgba(255,255,255,.7);font-size:.88rem}
  .card{background:rgba(13,42,77,.9);backdrop-filter:blur(8px);border:1px solid rgba(201,169,97,.3);border-radius:12px;padding:16px;box-shadow:0 4px 16px rgba(0,0,0,.35);margin-bottom:16px}
  .card h3{color:var(--dorado-brilloso);margin:0 0 10px;font-size:1rem}
  table{width:100%;border-collapse:collapse;font-size:.86rem}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.1);vertical-align:top}
  th{background:rgba(10,30,61,.97);color:var(--dorado-claro);position:sticky;top:0;white-space:nowrap;cursor:default}
  th.ord{cursor:pointer} th.ord:hover{color:#fff}
  tr.clic{cursor:pointer} tr.clic:hover{background:rgba(255,255,255,.07)}
  tr.urg{background:rgba(185,28,28,.18)}
  button.b,a.b{background:linear-gradient(135deg,var(--azul),var(--azul-claro));color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:.85rem;text-decoration:none;display:inline-block}
  button.b:hover{border-color:var(--dorado)} button.b:disabled{opacity:.5;cursor:default}
  button.b.ok{background:linear-gradient(135deg,#166534,var(--ok))}
  button.b.mal{background:linear-gradient(135deg,#991b1b,var(--mal))}
  button.b.gris{background:rgba(255,255,255,.12)}
  button.b.oro{background:linear-gradient(135deg,var(--dorado),var(--dorado-brilloso));color:var(--azul-oscuro);font-weight:700}
  button.b.chico{padding:4px 9px;font-size:.78rem}
  input,select{padding:9px;border:1px solid rgba(255,255,255,.25);border-radius:8px;font-size:.9rem;max-width:100%;background:rgba(0,0,0,.35);color:#fff;font-family:inherit}
  input:focus,select:focus{outline:none;border-color:var(--dorado);box-shadow:0 0 0 3px rgba(201,169,97,.2)}
  input::placeholder{color:rgba(255,255,255,.5)}
  select option{background:var(--azul-oscuro);color:#fff}
  .fila{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
  .tag{display:inline-block;padding:2px 9px;border-radius:10px;font-size:.74rem;background:rgba(255,255,255,.15);white-space:nowrap}
  .tag.pendiente{background:rgba(202,138,4,.35);color:#ffe082}
  .tag.enviado,.tag.procesado{background:rgba(21,128,61,.4);color:#a7f3c0}
  .tag.rechazado,.tag.denegado{background:rgba(185,28,28,.4);color:#fecaca}
  .tag.rojo{background:rgba(185,28,28,.45);color:#fecaca} .tag.amar{background:rgba(202,138,4,.4);color:#ffe082}
  #login{max-width:380px;margin:60px auto;text-align:center}
  #login::before{content:'';display:block;width:100px;height:100px;margin:0 auto 14px;background:url('logo-policia.png.jpeg') center/contain no-repeat;filter:drop-shadow(0 4px 20px rgba(201,169,97,.5))}
  #login input{width:100%;margin-bottom:10px}
  .msg{color:#fca5a5;font-size:.88rem;min-height:1.2em}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
  .kpi{background:rgba(13,42,77,.9);border:1px solid rgba(201,169,97,.3);border-radius:12px;padding:14px 16px;box-shadow:0 4px 16px rgba(0,0,0,.35);cursor:default}
  .kpi.clic{cursor:pointer} .kpi.clic:hover{border-color:var(--dorado)}
  .kpi b{font-size:1.9rem;display:block;color:var(--dorado-brilloso);line-height:1.1}
  .kpi span{font-size:.82rem;color:rgba(255,255,255,.75)}
  .kpi.alerta b{color:#fca5a5}
  .barra{background:rgba(255,255,255,.14);border-radius:4px;height:10px;margin:2px 0 9px}
  .barra i{display:block;height:10px;background:linear-gradient(90deg,var(--dorado),var(--dorado-claro));border-radius:4px}
  .dias{display:flex;align-items:flex-end;gap:2px;height:110px;margin-top:8px}
  .dias div{flex:1;background:linear-gradient(0deg,var(--dorado),var(--dorado-claro));border-radius:2px 2px 0 0;min-height:2px}
  .alerta-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:rgba(0,0,0,.25);margin-bottom:8px;cursor:pointer;border-left:4px solid var(--aviso)}
  .alerta-item.roja{border-left-color:var(--mal)} .alerta-item.verde{border-left-color:var(--ok);cursor:default}
  .alerta-item:hover{background:rgba(255,255,255,.08)}
  .oculto{display:none !important}
  .scroll{overflow-x:auto}
  .pag{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:.85rem}
  .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
  .modal>div{background:var(--azul-oscuro);border:1px solid var(--dorado);border-radius:14px;max-width:880px;width:100%;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
  .modal h3{margin:0 0 4px;color:var(--dorado-brilloso)}
  dl.det{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:12px 0}
  dl.det div{background:rgba(0,0,0,.25);border-radius:8px;padding:8px 10px}
  dl.det dt{font-size:.72rem;color:var(--dorado-claro);text-transform:uppercase;letter-spacing:.03em}
  dl.det dd{margin:2px 0 0;word-break:break-word}
  .fotos{display:flex;flex-wrap:wrap;gap:10px}
  .fotos figure{margin:0;text-align:center;font-size:.75rem}
  .fotos img{max-width:230px;border:2px solid var(--dorado);border-radius:8px;cursor:zoom-in;display:block}
  .chip{display:inline-flex;align-items:center;gap:6px;background:rgba(201,169,97,.2);border:1px solid var(--dorado);border-radius:14px;padding:2px 4px 2px 10px;font-size:.78rem;margin:2px}
  .chip button{background:none;border:0;color:#fff;cursor:pointer;font-size:1rem;line-height:1}
  #toast{position:fixed;bottom:20px;right:20px;background:var(--azul);border:1px solid var(--dorado);border-radius:10px;padding:12px 16px;z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.5);max-width:340px}
  small{color:rgba(255,255,255,.7)}
  #aviso-inact{position:fixed;top:0;left:0;right:0;background:var(--aviso);color:#000;text-align:center;padding:8px;z-index:90;font-weight:600}
  @media(max-width:820px){#app{flex-direction:column}#menu{width:100%;display:flex;overflow-x:auto;padding:0;border-right:0}
    #menu button{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent;padding:11px 14px}
    #menu button.on{border-bottom-color:var(--dorado)}main{padding:12px}}
</style>
</head>
<body>
<header>
  <h1><span>Administración · Mi Comisaría<small>Policía de Salta · Control de trámites de toda la provincia</small></span></h1>
  <div class="quien"><span id="quien"></span><span id="actualizado"></span><button class="b gris chico oculto" id="refrescar">⟳ Actualizar</button><button class="b gris chico oculto" id="salir">Salir</button></div>
</header>

<div id="login" class="card">
  <h2 style="color:var(--dorado-brilloso)">Acceso de administrador</h2>
  <input type="email" id="l-email" placeholder="Correo" autocomplete="username">
  <input type="password" id="l-pass" placeholder="Contraseña" autocomplete="current-password">
  <button class="b oro" id="l-entrar" style="width:100%;padding:11px">Ingresar</button>
  <p class="msg" id="l-msg"></p>
</div>

<div id="aviso-inact" class="oculto"></div>

<div id="app" class="oculto">
  <nav id="menu">
    <button data-t="inicio" class="on">🏠 Inicio</button>
    <button data-t="tramites">📄 Trámites</button>
    <button data-t="comisarias">🏢 Comisarías</button>
    <button data-t="pedidos">🔑 Pedidos de clave<span class="n oculto" id="n-ped"></span></button>
    <button data-t="asignaciones">📩 Asignaciones<span class="n oculto" id="n-asig"></span></button>
    <button data-t="personal">👮 Personal</button>
    <button data-t="stats">📊 Estadísticas</button>
    <button data-t="accesos">📋 Accesos</button>
    <button data-t="actividad">🕵️ Mi actividad</button>
  </nav>
  <main>
    <section id="t-inicio"></section>
    <section id="t-tramites" class="oculto"></section>
    <section id="t-comisarias" class="oculto"></section>
    <section id="t-pedidos" class="oculto"></section>
    <section id="t-asignaciones" class="oculto"></section>
    <section id="t-personal" class="oculto"></section>
    <section id="t-stats" class="oculto"></section>
    <section id="t-accesos" class="oculto"></section>
    <section id="t-actividad" class="oculto"></section>
  </main>
</div>
<div id="modal" class="modal oculto"></div>
<div id="toast" class="oculto"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="supabase-config.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const sb = supabaseClient;
const BUCKET = 'fotos-tramites';
const PANEL_URL = location.origin + location.pathname.replace(/[^\/]*$/, '') + 'panel.html';
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (d) => d ? new Date(d).toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' }) : '—';
const fmtDia = (d) => d ? new Date(d).toLocaleDateString('es-AR') : '—';
const ESTADO = { pendiente: 'Pendiente', procesado: 'Aprobado', denegado: 'Denegado' };
const DIA = 86400000;

let yo = null, solicitudes = [], deps = [], personal = [], pedidos = [], asignaciones = [], depPorClave = {};
let vistaActual = 'inicio';

function toast(t) { const e = $('toast'); e.textContent = t; e.classList.remove('oculto'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.add('oculto'), 4000); }
const nombreDep = (c) => !c ? '(sin asignar)' : (depPorClave[c] ? depPorClave[c].nombre : String(c).replace(/^DUR\s*\d+\s*-\s*S\s*\d+\s*-\s*/i, '').trim());
const datos = (s) => s.datos || {};
const nombreDe = (s) => { const d = datos(s); return d.nombre || d.nombreSolicitante || d.nombreMenor || d.nombreProgenitor || ''; };
const dniDe = (s) => { const d = datos(s); return d.dni || d.dniSolicitante || d.dniMenor || d.dniProgenitor || ''; };
const tramiteDe = (s) => s.tramite_titulo || s.tramite || '';
const diasEspera = (s) => s.estado === 'pendiente' ? Math.floor((Date.now() - new Date(s.created_at)) / DIA) : null;

/* ---------- Sesión ---------- */
async function iniciar() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) await continuarSesion(session.user);
}
function registrar(accion, detalle) { try { sb.rpc('admin_registrar_accion', { p_accion: accion, p_detalle: detalle || {} }).then(() => {}, () => {}); } catch (e) {} }

async function continuarSesion(user) { return verificarAdmin(user); }
async function verificarAdmin(user) {
  const { data, error } = await sb.from('personal').select('rol,activo').eq('user_id', user.id).maybeSingle();
  if (error || !data || data.rol !== 'admin' || !data.activo) {
    await sb.auth.signOut();
    $('login').classList.remove('oculto');
    $('l-msg').textContent = 'Esta cuenta no es de administrador.';
    return;
  }
  yo = user;
  $('login').classList.add('oculto');
  $('app').classList.remove('oculto');
  $('salir').classList.remove('oculto'); $('refrescar').classList.remove('oculto');
  $('quien').textContent = '👑 ' + user.email;
  iniciarInactividad();
  registrar('ingreso');
  await cargarTodo();
  setInterval(() => cargarTodo(true), 90000);
}
/* Cierre automático por inactividad (15 min, aviso al minuto 14) */
const MAX_INACT = 15 * 60000, AVISO_INACT = 14 * 60000;
let ultimaActividad = Date.now();
function iniciarInactividad() {
  ['click', 'keydown', 'mousemove', 'touchstart', 'scroll'].forEach(ev => document.addEventListener(ev, () => { ultimaActividad = Date.now(); }, { passive: true }));
  setInterval(async () => {
    const ocioso = Date.now() - ultimaActividad;
    if (ocioso >= MAX_INACT) { registrar('cierre_por_inactividad'); await sb.auth.signOut(); location.reload(); return; }
    const a = $('aviso-inact');
    if (ocioso >= AVISO_INACT) { a.textContent = '⏱ Tu sesión se cerrará en ' + Math.ceil((MAX_INACT - ocioso) / 1000) + ' s por inactividad. Mové el mouse para seguir.'; a.classList.remove('oculto'); }
    else a.classList.add('oculto');
  }, 1000);
}
$('l-entrar').onclick = async () => {
  $('l-msg').textContent = '';
  const { data, error } = await sb.auth.signInWithPassword({ email: $('l-email').value.trim(), password: $('l-pass').value });
  if (error) { $('l-msg').textContent = 'Correo o contraseña incorrectos.'; return; }
  await continuarSesion(data.user);
};
$('l-pass').addEventListener('keydown', e => { if (e.key === 'Enter') $('l-entrar').click(); });
$('salir').onclick = async () => { registrar('salida'); setTimeout(async () => { await sb.auth.signOut(); location.reload(); }, 400); };
$('refrescar').onclick = () => cargarTodo();

/* ---------- Carga de datos ---------- */
async function cargarTodo(silencioso) {
  if (!deps.length) {
    try { deps = await (await fetch('dependencias.json?v=1')).json(); } catch (e) { deps = []; }
    deps.forEach(d => { d.nombre = d.nombre || String(d.clave).replace(/^DUR\s*\d+\s*-\s*S\s*\d+\s*-\s*/i, '').trim(); depPorClave[d.clave] = d; });
  }
  const [s, p, pe, as] = await Promise.all([
    sb.from('solicitudes').select('*').order('created_at', { ascending: false }).limit(5000),
    sb.rpc('admin_listar_personal'),
    sb.from('pedidos_clave').select('*').order('created_at', { ascending: false }).limit(200),
    sb.from('pedidos_asignacion').select('*').order('created_at', { ascending: false }).limit(200)
  ]);
  if (!as.error) asignaciones = as.data || [];
  if (!s.error) solicitudes = s.data || [];
  if (!p.error) personal = p.data || [];
  if (!pe.error) pedidos = pe.data || [];
  const pend = pedidos.filter(x => x.estado === 'pendiente').length;
  $('n-ped').textContent = pend; $('n-ped').classList.toggle('oculto', !pend);
  const nAs = asignaciones.filter(x => x.estado === 'pendiente').length;
  $('n-asig').textContent = nAs; $('n-asig').classList.toggle('oculto', !nAs);
  $('actualizado').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
  if (!silencioso || vistaActual === 'inicio') pintar(vistaActual, silencioso);
  else if (vistaActual === 'pedidos') pintarPedidos();
}
const PINTORES = {};
function pintar(v, silencioso) { (PINTORES[v] || (() => {}))(silencioso); }
$('menu').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) irA(b.dataset.t); });
function irA(t) {
  vistaActual = t;
  document.querySelectorAll('#menu button').forEach(x => x.classList.toggle('on', x.dataset.t === t));
  ['inicio','tramites','comisarias','pedidos','asignaciones','personal','stats','accesos','actividad'].forEach(x => $('t-' + x).classList.toggle('oculto', x !== t));
  pintar(t);
}
const barras = (arr, max) => { const mx = Math.max(1, ...arr.map(x => x.n)); return arr.slice(0, max || 99).map(x => '<div>' + esc(x.k) + ' <b>' + x.n + '</b><div class="barra"><i style="width:' + (100 * x.n / mx) + '%"></i></div></div>').join('') || '<small>Sin datos.</small>'; };
const contar = (lista, f) => { const m = {}; lista.forEach(s => { const k = f(s) || '(sin dato)'; m[k] = (m[k] || 0) + 1; }); return Object.entries(m).map(([k, n]) => ({ k, n })).sort((a, b) => b.n - a.n); };

/* ---------- INICIO ---------- */
PINTORES.inicio = () => {
  const pend = solicitudes.filter(s => s.estado === 'pendiente');
  const hoy = new Date().toDateString();
  const urg = pend.filter(s => s.urgente);
  const viejas = pend.filter(s => diasEspera(s) >= 3);
  const hoyN = solicitudes.filter(s => new Date(s.created_at).toDateString() === hoy).length;
  const resHoy = solicitudes.filter(s => s.validado_en && new Date(s.validado_en).toDateString() === hoy).length;
  const pedPend = pedidos.filter(p => p.estado === 'pendiente').length;
  const sinPersonal = comisariasResumen().filter(c => c.pend > 0 && !c.personal).length;
  const dias = []; for (let i = 29; i >= 0; i--) { const d = new Date(Date.now() - i * DIA); const k = d.toDateString();
    dias.push({ k: d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' }), n: solicitudes.filter(s => new Date(s.created_at).toDateString() === k).length }); }
  const mx = Math.max(1, ...dias.map(d => d.n));
  const alertas = [];
  const asigPend = asignaciones.filter(x => x.estado === 'pendiente').length;
  if (asigPend) alertas.push(['', '📩 ' + asigPend + ' pedido(s) de asignación de comisaría esperando tu respuesta', 'asignaciones']);
  if (pedPend) alertas.push(['', '🔑 ' + pedPend + ' pedido(s) de contraseña esperando tu respuesta', 'pedidos']);
  if (urg.length) alertas.push(['roja', '🚨 ' + urg.length + ' trámite(s) marcados como urgentes sin resolver', 'urgentes']);
  if (viejas.length) alertas.push(['roja', '⏱ ' + viejas.length + ' trámite(s) pendientes hace 3 días o más', 'viejas']);
  if (sinPersonal) alertas.push(['', '🏢 ' + sinPersonal + ' comisaría(s) con trámites pendientes y SIN personal asignado', 'comisarias']);
  $('t-inicio').innerHTML = '<h2 class="titulo">Panel de control</h2><p class="sub">Resumen de toda la provincia de Salta. Hacé clic en los cuadros para ver el detalle.</p>' +
    '<div class="grid"><div class="kpi clic" data-ir="todos"><b>' + solicitudes.length + '</b><span>Trámites totales</span></div>' +
    '<div class="kpi clic ' + (pend.length ? 'alerta' : '') + '" data-ir="pendientes"><b>' + pend.length + '</b><span>Pendientes de resolver</span></div>' +
    '<div class="kpi clic ' + (urg.length ? 'alerta' : '') + '" data-ir="urgentes"><b>' + urg.length + '</b><span>Urgentes</span></div>' +
    '<div class="kpi clic ' + (viejas.length ? 'alerta' : '') + '" data-ir="viejas"><b>' + viejas.length + '</b><span>Pendientes +3 días</span></div>' +
    '<div class="kpi"><b>' + hoyN + '</b><span>Ingresaron hoy</span></div><div class="kpi"><b>' + resHoy + '</b><span>Resueltos hoy</span></div>' +

    if (!m[c]) m[c] = { clave: c, nombre: nombreDep(c), tipo: '', distrito: '', pend: 0, total: 0, aprob: 0, deneg: 0, max: 0, personal: 0 };
    m[c].total++; if (s.estado === 'pendiente') { m[c].pend++; m[c].max = Math.max(m[c].max, diasEspera(s)); } else if (s.estado === 'procesado') m[c].aprob++; else if (s.estado === 'denegado') m[c].deneg++; });
  personal.filter(p => p.activo && p.rol !== 'admin').forEach(p => (p.comisarias || []).forEach(c => { if (m[c]) m[c].personal++; }));

}

  } else if (rech) {
    const nota = prompt('Motivo (opcional):'); if (nota === null) return;
    const r = await sb.rpc('admin_atender_pedido', { p_id: rech, p_estado: 'rechazado', p_nota: nota }); if (r.error) alert(r.error.message); registrar('rechazar_pedido_clave', { id: rech });
    cargarTodo();
  }
});

/* ---------- ASIGNACIONES DE COMISARÍA ---------- */
PINTORES.asignaciones = () => {
  const b = $('t-asignaciones');
  b.innerHTML = '<h2 class="titulo">Pedidos de asignación de comisaría</h2><p class="sub">Personal que entró al panel sin comisaría y pide que se la asignes. Verificá con su jefe antes de aprobar. Al aprobar, se le agrega la comisaría y verá sus trámites la próxima vez que ingrese.</p><div class="card scroll"><table><tr><th>Cuándo</th><th>Persona</th><th>Pide</th><th>Mensaje</th><th>Estado</th><th></th></tr>' +
    asignaciones.map(a => '<tr><td>' + fmt(a.created_at) + '<br><small>' + hace(a.created_at) + '</small></td><td>' + esc(a.nombre) + '<br><small>' + esc(a.email) + '</small></td><td><b>' + esc(nombreDep(a.comisaria)) + '</b></td><td>' + esc(a.mensaje) + '</td><td><span class="tag ' + (a.estado === 'aprobado' ? 'procesado' : a.estado === 'rechazado' ? 'denegado' : 'pendiente') + '">' + esc(a.estado) + '</span>' + (a.atendido_por ? '<br><small>' + esc(a.atendido_por) + '<br>' + fmt(a.atendido_en) + '</small>' : '') + '</td><td>' +
      (a.estado === 'pendiente' ? '<button class="b ok chico" data-apr="' + a.id + '">Aprobar</button> <button class="b mal chico" data-rec="' + a.id + '">Rechazar</button>' : '') + '</td></tr>').join('') +
    (asignaciones.length ? '' : '<tr><td colspan="6">No hay pedidos.</td></tr>') + '</table></div>';
};
$('t-asignaciones').addEventListener('click', async (e) => {
  const apr = e.target.dataset.apr, rec = e.target.dataset.rec; if (!apr && !rec) return;
  const a = asignaciones.find(x => x.id === (apr || rec)); if (!a) return;
  if (apr && !confirm('¿Asignar ' + nombreDep(a.comisaria) + ' a ' + a.nombre + '?')) return;
  let nota = ''; if (rec) { nota = prompt('Motivo (opcional):'); if (nota === null) return; }
  const r = await sb.rpc('admin_resolver_asignacion', { p_id: a.id, p_aprobar: !!apr, p_comisaria: a.comisaria, p_nota: nota });
  if (r.error) return alert(r.error.message);
  registrar(apr ? 'aprobar_asignacion' : 'rechazar_asignacion', { correo: a.email, comisaria: nombreDep(a.comisaria) });
  toast(apr ? 'Comisaría asignada' : 'Pedido rechazado'); cargarTodo();
});

/* ---------- PERSONAL ---------- */
const JERARQUIAS = { 'OFICIAL': ['PRINCIPAL', 'AUXILIAR', 'AYUDANTE', 'SUB AYUDANTE'], 'SUB-OFICIAL': ['MAYOR', 'PRINCIPAL', 'SGTO AYUDANTE', 'SARGENTO', 'CABO', 'AGENTE'] };
const selCategoria = (id, val) => '<select id="' + id + '"><option value="">Personal…</option><option' + (val === 'OFICIAL' ? ' selected' : '') + '>OFICIAL</option><option' + (val === 'SUB-OFICIAL' ? ' selected' : '') + '>SUB-OFICIAL</option></select>';
const selRango = (id, cat, val) => '<select id="' + id + '"><option value="">Jerarquía…</option>' + (JERARQUIAS[cat] || []).map(r => '<option' + (r === val ? ' selected' : '') + '>' + r + '</option>').join('') + '</select>';
const partirJerarquia = (j) => { j = j || ''; const cat = j.startsWith('SUB-OFICIAL') ? 'SUB-OFICIAL' : j.startsWith('OFICIAL') ? 'OFICIAL' : ''; return [cat, cat ? j.slice(cat.length).trim() : '']; };
const juntarJerarquia = (cat, rango) => cat && rango ? cat + ' ' + rango : '';
function enlazarJerarquia(idCat, idRango) { $(idCat).onchange = () => { $(idRango).outerHTML = selRango(idRango, $(idCat).value, ''); }; }
let editandoCom = null;
function chipsHtml(arr) { return arr.map((c, i) => '<span class="chip">' + esc(nombreDep(c)) + '<button data-quitar="' + i + '">×</button></span>').join('') || '<small>Ninguna</small>'; }
const opcionesDeps = () => deps.slice().sort((a, b) => a.nombre.localeCompare(b.nombre, 'es', { numeric: true })).map(x => '<option value="' + esc(x.nombre) + '"></option>').join('');
const claveDeNombre = (n) => (deps.find(d => d.nombre === n.trim()) || {}).clave;
let altaCom = [], persQ = '';
PINTORES.personal = () => {
  const lista = personal.filter(p => !persQ || (p.nombre + ' ' + p.email).toLowerCase().includes(persQ));
  const fila = (p) => '<tr><td>' + esc(p.nombre || '') + '<br><small>' + esc(p.jerarquia || '') + '</small></td><td>' + esc(p.legajo || '—') + '</td><td>' + esc(p.email) + '</td><td>' + ((p.comisarias || []).map(c => esc(nombreDep(c))).join(', ') || '<small>—</small>') + '</td><td>' + fmt(p.ultimo_ingreso) + '</td><td><span class="tag ' + (p.activo ? 'procesado' : 'denegado') + '">' + (p.activo ? 'Activo' : 'Baja') + '</span></td><td><button class="b chico" data-edit="' + p.user_id + '">Editar</button></td></tr>';
  const tabla = (t, l) => '<div class="card scroll"><h3>' + t + ' (' + l.length + ')</h3><table><tr><th>Nombre y jerarquía</th><th>Legajo</th><th>Correo</th><th>Comisarías</th><th>Último ingreso</th><th>Estado</th><th></th></tr>' + (l.map(fila).join('') || '<tr><td colspan="7">Nadie cargado.</td></tr>') + '</table></div>';
  $('t-personal').innerHTML = '<h2 class="titulo">Personal</h2><p class="sub">Cuentas que usan el panel privado.</p>' +
    '<div class="card"><h3>Dar de alta</h3><p><small>Primero creá el usuario en Supabase → Authentication → Users → Add user (con "Auto Confirm User"), después cargalo acá.</small></p><div class="fila"><input id="a-mail" type="email" placeholder="correo" size="26"><input id="a-nom" placeholder="Apellido y nombre" size="22"><input id="a-leg" inputmode="numeric" maxlength="5" placeholder="Legajo (5 números)" size="16"></div><div class="fila">' + selCategoria('a-cat', '') + selRango('a-ran', '', '') + '</div>' +
    '<div class="fila"><input id="a-com" list="dl-deps" placeholder="Agregar comisaría (escribí para buscar)" size="38" autocomplete="off"><datalist id="dl-deps">' + opcionesDeps() + '</datalist><button class="b chico" id="a-add">+ Agregar</button></div><div id="a-chips">' + chipsHtml(altaCom) + '</div><div class="fila" style="margin-top:10px"><button class="b ok" id="a-alta">Dar de alta</button></div></div>' +
    '<div class="card"><input id="p-q" placeholder="🔍 Buscar persona…" size="28" value="' + esc(persQ) + '"></div>' +
    tabla('👑 Administradores', lista.filter(p => p.rol === 'admin')) + tabla('👮 Personal de comisarías', lista.filter(p => p.rol !== 'admin'));
  enlazarJerarquia('a-cat', 'a-ran');
  $('p-q').addEventListener('input', (e) => { persQ = e.target.value.toLowerCase(); const pos = e.target.selectionStart; PINTORES.personal(); $('p-q').focus(); $('p-q').setSelectionRange(pos, pos); });
};
$('t-personal').addEventListener('click', async (e) => {
  const t = e.target;
  if (t.id === 'a-add') { const c = claveDeNombre($('a-com').value); if (!c) return alert('Elegí una comisaría de la lista.'); if (!altaCom.includes(c)) altaCom.push(c); $('a-com').value = ''; $('a-chips').innerHTML = chipsHtml(altaCom); }
  else if (t.dataset.quitar != null && t.closest('#a-chips')) { altaCom.splice(+t.dataset.quitar, 1); $('a-chips').innerHTML = chipsHtml(altaCom); }
  else if (t.id === 'a-alta') { const r = await sb.rpc('admin_alta_personal', { p_email: $('a-mail').value, p_nombre: $('a-nom').value, p_comisarias: altaCom, p_legajo: $('a-leg').value, p_jerarquia: juntarJerarquia($('a-cat').value, $('a-ran').value) }); if (r.error) return alert(r.error.message); registrar('alta_personal', { correo: $('a-mail').value, legajo: $('a-leg').value, comisarias: altaCom }); altaCom = []; toast('Persona dada de alta'); cargarTodo(); }
  else if (t.dataset.edit) editarPersona(t.dataset.edit);
});
function editarPersona(uid) {
  const p = personal.find(x => x.user_id === uid); if (!p) return; editandoCom = (p.comisarias || []).slice();
  $('modal').innerHTML = '<div style="max-width:620px"><div class="fila"><h3 style="flex:1">Editar: ' + esc(p.email) + '</h3><button class="b gris chico" data-cerrar="1">✕</button></div>' +
    '<div class="fila"><input id="e-nom" value="' + esc(p.nombre || '') + '" placeholder="Nombre" size="30"><input id="e-leg" inputmode="numeric" maxlength="5" value="' + esc(p.legajo || '') + '" placeholder="Legajo (5 números)" size="16"></div><div class="fila">' + selCategoria('e-cat', partirJerarquia(p.jerarquia)[0]) + selRango('e-ran', partirJerarquia(p.jerarquia)[0], partirJerarquia(p.jerarquia)[1]) + '</div><p><b>Comisarías que puede ver</b></p><div id="e-chips">' + chipsHtml(editandoCom) + '</div>' +
    '<div class="fila"><input id="e-com" list="dl-deps2" placeholder="Agregar comisaría…" size="34" autocomplete="off"><datalist id="dl-deps2">' + opcionesDeps() + '</datalist><button class="b chico" id="e-add">+ Agregar</button></div>' +
    '<div class="fila"><label><input type="checkbox" id="e-act"' + (p.activo ? ' checked' : '') + '> Cuenta activa (si la destildás, no puede ingresar)</label></div><div class="fila"><button class="b ok" id="e-guardar">Guardar</button></div></div>';
  $('modal').classList.remove('oculto');
  enlazarJerarquia('e-cat', 'e-ran');
  $('e-add').onclick = () => { const c = claveDeNombre($('e-com').value); if (!c) return alert('Elegí una comisaría de la lista.'); if (!editandoCom.includes(c)) editandoCom.push(c); $('e-com').value = ''; $('e-chips').innerHTML = chipsHtml(editandoCom); };
  $('e-chips').onclick = (e) => { if (e.target.dataset.quitar != null) { editandoCom.splice(+e.target.dataset.quitar, 1); $('e-chips').innerHTML = chipsHtml(editandoCom); } };
  $('e-guardar').onclick = async () => { const r = await sb.rpc('admin_actualizar_personal', { p_user_id: uid, p_nombre: $('e-nom').value, p_comisarias: editandoCom, p_activo: $('e-act').checked, p_legajo: $('e-leg').value, p_jerarquia: juntarJerarquia($('e-cat').value, $('e-ran').value) }); if (r.error) return alert(r.error.message); registrar('editar_personal', { correo: p.email, activo: $('e-act').checked, comisarias: editandoCom }); cerrarModal(); toast('Guardado'); cargarTodo(); };
}

/* ---------- ESTADÍSTICAS ---------- */
let statDias = 30;
PINTORES.stats = () => {
  const desde = statDias ? Date.now() - statDias * DIA : 0;
  const l = solicitudes.filter(s => new Date(s.created_at) >= desde);
  const res = l.filter(s => s.estado !== 'pendiente' && s.validado_en);
  const horas = res.map(s => (new Date(s.validado_en) - new Date(s.created_at)) / 3600000).filter(x => x >= 0);
  const prom = horas.length ? horas.reduce((a, b) => a + b, 0) / horas.length : null;
  const deneg = l.filter(s => s.estado === 'denegado').length, resueltos = l.filter(s => s.estado !== 'pendiente').length;
  $('t-stats').innerHTML = '<h2 class="titulo">Estadísticas</h2><div class="fila"><span>Período:</span><select id="s-per"><option value="7">Últimos 7 días</option><option value="30">Últimos 30 días</option><option value="90">Últimos 90 días</option><option value="0">Todo</option></select></div>' +
    '<div class="grid"><div class="kpi"><b>' + l.length + '</b><span>Trámites en el período</span></div><div class="kpi"><b>' + (prom == null ? '—' : prom < 48 ? prom.toFixed(1) + ' h' : (prom / 24).toFixed(1) + ' d') + '</b><span>Tiempo promedio de resolución</span></div><div class="kpi"><b>' + (resueltos ? Math.round(100 * deneg / resueltos) + '%' : '—') + '</b><span>Tasa de denegación</span></div><div class="kpi"><b>' + l.filter(s => s.estado === 'pendiente').length + '</b><span>Siguen pendientes</span></div></div>' +
    '<div class="grid2"><div class="card"><h3>Por trámite</h3>' + barras(contar(l, tramiteDe), 12) + '</div><div class="card"><h3>Por estado</h3>' + barras(contar(l, s => ESTADO[s.estado] || s.estado)) + '</div>' +
    '<div class="card"><h3>Comisarías con más trámites</h3>' + barras(contar(l, s => nombreDep(s.comisaria_asignada)), 15) + '</div><div class="card"><h3>Denegaciones por comisaría</h3>' + barras(contar(l.filter(s => s.estado === 'denegado'), s => nombreDep(s.comisaria_asignada)), 10) + '</div></div>';
  $('s-per').value = String(statDias); $('s-per').onchange = (e) => { statDias = +e.target.value; PINTORES.stats(); };
};

/* ---------- ACCESOS ---------- */
let accesos = [], accQ = '', accFalla = false;
PINTORES.accesos = async () => {
  const b = $('t-accesos');
  if (!b.dataset.listo) { b.dataset.listo = '1'; b.innerHTML = '<h2 class="titulo">Accesos al panel</h2><p class="sub">Cada vez que alguien del personal ingresó: quién, cuándo y desde qué navegador y equipo. Sirve para detectar ingresos raros. Últimos 500.</p><div class="card"><div class="fila"><input id="ac-q" placeholder="🔍 Filtrar por correo o equipo…" size="30"><label><input type="checkbox" id="ac-f"> Solo intentos fallidos</label><button class="b gris chico" id="ac-r">⟳ Actualizar</button></div><div class="scroll" id="ac-l"></div></div>';
    $('ac-q').oninput = () => { accQ = $('ac-q').value.toLowerCase(); pintarAccesos(); }; $('ac-f').oninput = () => { accFalla = $('ac-f').checked; pintarAccesos(); }; $('ac-r').onclick = () => { b.dataset.listo = ''; PINTORES.accesos(); }; }
  const { data, error } = await sb.from('logs_accesos').select('*').order('fecha', { ascending: false }).limit(500);
  if (error) { $('ac-l').innerHTML = '<p class="msg">' + esc(error.message) + '</p>'; return; }
  accesos = data; pintarAccesos();
};
function pintarAccesos() {
  const tipos = { login: 'Ingresó', logout: 'Salió', error: 'Intento fallido', fallo: 'Intento fallido' };
  const l = accesos.filter(a => (!accQ || ((a.email || '') + ' ' + (a.dispositivo || '')).toLowerCase().includes(accQ)) && (!accFalla || /error|fall/.test(a.tipo || '')));
  $('ac-l').innerHTML = '<table><tr><th>Fecha y hora</th><th>Correo</th><th>Acción</th><th>Navegador / equipo</th></tr>' + l.map(a => '<tr><td>' + fmt(a.fecha) + '</td><td>' + esc(a.email || '') + '</td><td>' + esc(tipos[a.tipo] || a.tipo || '') + '</td><td>' + esc(a.dispositivo || '') + '</td></tr>').join('') + (l.length ? '' : '<tr><td colspan="4">Sin registros.</td></tr>') + '</table>';
}
PINTORES.actividad = async () => {
  const b = $('t-actividad');
  b.innerHTML = '<h2 class="titulo">Mi actividad</h2><p class="sub">Registro de todo lo que hace el administrador en esta web: ingresos, trámites abiertos, derivaciones, altas y bajas de personal, envíos de enlaces y exportaciones. Últimos 500.</p><div class="card scroll" id="act-l">Cargando…</div>';
  const { data, error } = await sb.from('acciones_admin').select('*').order('fecha', { ascending: false }).limit(500);
  if (error) { $('act-l').innerHTML = '<p class="msg">' + esc(error.message) + ' (¿ejecutaste administrador-seguridad.sql?)</p>'; return; }
  const nom = { ingreso: 'Ingresó', salida: 'Salió', cierre_por_inactividad: 'Sesión cerrada por inactividad', ver_tramite: 'Abrió un trámite', derivar_tramite: 'Derivó un trámite', marcar_urgente: 'Marcó urgente', quitar_urgente: 'Quitó urgente', exportar_excel: 'Exportó a Excel', enviar_enlace_clave: 'Envió enlace de contraseña', rechazar_pedido_clave: 'Rechazó pedido de contraseña', alta_personal: 'Dio de alta personal', editar_personal: 'Editó personal', aprobar_asignacion: 'Aprobó asignación de comisaría', rechazar_asignacion: 'Rechazó asignación de comisaría' };
  $('act-l').innerHTML = '<table><tr><th>Fecha y hora</th><th>Administrador</th><th>Acción</th><th>Detalle</th></tr>' + data.map(a => '<tr><td>' + fmt(a.fecha) + '</td><td>' + esc(a.admin_email) + '</td><td>' + esc(nom[a.accion] || a.accion) + '</td><td><small>' + esc(Object.entries(a.detalle || {}).filter(([k]) => k !== 'id').map(([k, v]) => k + ': ' + (Array.isArray(v) ? v.join(', ') : v)).join(' · ')) + '</small></td></tr>').join('') + (data.length ? '' : '<tr><td colspan="4">Sin registros.</td></tr>') + '</table>';
};
iniciar();
</script>
</body>
</html>
